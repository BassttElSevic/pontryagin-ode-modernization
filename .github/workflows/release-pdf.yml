name: Release PDF

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and update
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-pdf-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  TECTONIC_VERSION: "0.17.0"
  TECTONIC_SHA256: "8533d07f9ccbd7a65824b9e0459041bca34af1eb33daba48f59215593753a3b7"

jobs:
  build-and-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Cache Tectonic bundle
        uses: actions/cache@v6
        with:
          path: ~/.cache/Tectonic
          key: tectonic-${{ runner.os }}-${{ env.TECTONIC_VERSION }}-v1

      - name: Install Tectonic
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/tectonic.tar.gz"
          url="https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%40${TECTONIC_VERSION}/tectonic-${TECTONIC_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "$url" --output "$archive"
          echo "${TECTONIC_SHA256}  ${archive}" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/tectonic"
          tar -xzf "$archive" -C "$RUNNER_TEMP/tectonic"
          install -m 0755 "$RUNNER_TEMP/tectonic/tectonic" /usr/local/bin/tectonic
          tectonic --version

      - name: Build PDF
        run: python scripts/build.py

      - name: Prepare release asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          release_slug="${RELEASE_TAG//\//-}"
          asset_name="pontryagin-ode-modernization-${release_slug}.pdf"
          cp build/main.pdf "dist/$asset_name"
          (
            cd dist
            sha256sum "$asset_name" > "$asset_name.sha256"
          )
          echo "RELEASE_SLUG=$release_slug" >> "$GITHUB_ENV"
          echo "PDF_ASSET=dist/$asset_name" >> "$GITHUB_ENV"

      - name: Store workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: pontryagin-ode-modernization-${{ env.RELEASE_SLUG }}
          path: |
            ${{ env.PDF_ASSET }}
            ${{ env.PDF_ASSET }}.sha256
          if-no-files-found: error

      - name: Upload PDF to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" >/dev/null
          gh release upload "$RELEASE_TAG" \
            "$PDF_ASSET" \
            "$PDF_ASSET.sha256" \
            --clobber
